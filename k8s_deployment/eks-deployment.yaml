apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-page-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-page
  template:
    metadata:
      labels:
        app: mock-page
    spec:
      containers:
      - name: mock-page
        image: mock-page:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mock-page-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: mock-page
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
