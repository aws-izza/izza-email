apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: app
type: Opaque
stringData:
  # IMPORTANT: Replace "YOUR_STRONG_PASSWORD" with a strong, secure password.
  ROOT_PASSWORD: "test1234test"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi # You can adjust the storage size as needed.
  # For EKS, you should have a default StorageClass (like gp2 or gp3).
  # If not, you may need to specify a storageClassName.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: app
spec:
  serviceName: "mariadb"
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.6 # You can use a specific version of MariaDB
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: ROOT_PASSWORD
        volumeMounts:
        - name: mariadb-persistent-storage
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mariadb-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-nlb-service
  namespace: app
  annotations:
    # This annotation specifies that you want an NLB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # You can add other NLB-specific annotations here if needed.
spec:
  type: LoadBalancer
  selector:
    app: mariadb
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
