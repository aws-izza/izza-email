<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산업단지 뉴스레터</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .header {
            background-color: #4caf50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .notice-info {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
        }

        .notice-info h2 {
            color: #4caf50;
            margin-top: 0;
            font-size: 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-label {
            font-weight: bold;
            color: #555;
        }

        .analysis {
            margin: 20px 0;
            line-height: 1.6;
        }

        .analysis h2 {
            color: #4caf50;
            font-size: 16px;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #e9ecef;
        }

        .analysis h2:first-child {
            margin-top: 0;
        }

        .analysis p {
            margin: 10px 0;
        }

        .analysis ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .analysis li {
            margin: 5px 0;
            line-height: 1.5;
        }

        .footer {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .pdf-link {
            display: inline-block;
            background-color: #4caf50;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
        }

        .pdf-link:hover {
            background-color: #45a049;
        }

        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-container">
            <svg width="72" height="32" viewBox="0 0 72 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path

                    fill="#4caf50"></path>

                    fill="#4caf50"></path>
                <path
                    d="M27.3383 27.9646H14.8835C13.0903 27.9646 12.8947 26.7908 13.6446 25.5193L18.959 15.8685H14.1336C13.2207 15.8685 12.7969 15.575 12.7969 14.6621V10.9778C12.7969 10.0975 13.2207 9.77148 14.1336 9.77148H27.0449C28.7729 9.77148 29.0663 10.9126 28.2838 12.2168L22.8715 21.9002H27.3383C28.2512 21.9002 28.6751 22.1936 28.6751 23.1066V26.7256C28.6751 27.6385 28.2512 27.9646 27.3383 27.9646Z"
                    fill="#4caf50"></path>
                <path
                    d="M4.32604 26.4968L4 5.46719C4 4.32604 4.32604 4 5.23896 4H9.93395C10.8795 4 11.1403 4.32604 11.1729 5.46719L11.4989 26.4968C11.5315 27.638 11.2055 27.964 10.26 27.964H5.565C4.65208 27.964 4.35865 27.638 4.32604 26.4968Z"
                    fill="#4caf50"></path>
            </svg>
        </div>
        <div class="header">
            <h1>📰 산업단지 뉴스레터</h1>
            <p>{{ notice_data.고시일자 }}자</p>
        </div>

        <div class="notice-info">
            <h2>📌 주요 고시 내용</h2>
            <div class="info-grid">
                <div class="info-label">지역:</div>
                <div>{{ notice_data.시도 }} {{ notice_data.시군구 }}</div>

                <div class="info-label">유형:</div>
                <div>{{ notice_data.유형 }}</div>

                <div class="info-label">단지명:</div>
                <div>{{ notice_data.단지명 }}</div>

                <div class="info-label">고시명:</div>
                <div>{{ notice_data.고시명 }}</div>
            </div>
        </div>

        <div class="analysis">
            {{ analyzed_content|safe }}
        </div>

        <div class="footer">
            <h3>📄 참고 정보</h3>
            <p><strong>고시일자:</strong> {{ notice_data.고시일자 }}</p>
            <p><strong>고시번호:</strong> {{ notice_data.고시번호 }}</p>
        </div>
    </div>
</body>

</html>
